# Static analysis configuration for FantasianSGE.
#
# The strict language modes below turn implicit `dynamic` into errors, so every
# value that crosses a JSON, SQLite or platform boundary has to be checked and
# given a real type before it is used.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    dead_code: warning
  exclude:
    - build/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_type_to_string
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_constructors_first
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
