# Analyses, tests and builds FantasianSGE for every supported platform.
# Builds are unsigned; download them from the run's artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent FantasianSGE.app FantasianSGE-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FantasianSGE-macos
          path: build/macos/Build/Products/Release/FantasianSGE-macos.zip

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Unsigned: proves the iOS build compiles. Sign it in Xcode to install.
      - run: flutter build ios --release --no-codesign

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: FantasianSGE-windows
          path: build/windows/x64/runner/Release/

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: FantasianSGE-linux
          path: build/linux/x64/release/bundle/
